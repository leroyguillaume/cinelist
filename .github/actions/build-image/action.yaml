name: build-image
description: Builds one image for one architecture into the local store and scans it with Trivy.

inputs:
  image:
    description: Image to build (api or web)
    required: true
  arch:
    description: Architecture to build for (amd64 or arm64)
    required: true

outputs:
  labels:
    description: OCI labels the image was built with
    value: ${{ steps.meta.outputs.labels }}
  ref:
    description: Local reference of the scanned image
    value: ${{ steps.ref.outputs.ref }}

runs:
  using: composite
  steps:
    - name: derive the image labels
      id: meta
      uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
      with:
        images: ghcr.io/${{ github.repository_owner }}/cinelist-${{ inputs.image }}
    - name: name the local image
      id: ref
      shell: bash
      env:
        OWNER: ${{ github.repository_owner }}
        IMAGE: ${{ inputs.image }}
      run: echo "ref=ghcr.io/${OWNER}/cinelist-${IMAGE}:scan" >> "$GITHUB_OUTPUT"
    - name: set up Docker Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1
    - name: build the image
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
      with:
        context: .
        file: ${{ inputs.image }}/Dockerfile
        platforms: linux/${{ inputs.arch }}
        labels: ${{ steps.meta.outputs.labels }}
        tags: ${{ steps.ref.outputs.ref }}
        load: true
        cache-from: type=gha,scope=${{ inputs.image }}-${{ inputs.arch }}
        cache-to: type=gha,mode=max,scope=${{ inputs.image }}-${{ inputs.arch }}
    - name: report every vulnerability
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
      with:
        image-ref: ${{ steps.ref.outputs.ref }}
        format: sarif
        output: trivy-build.sarif
        cache: true
    - name: upload the report
      uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2  # v4.38.2
      with:
        sarif_file: trivy-build.sarif
        category: trivy-build-${{ inputs.image }}-${{ inputs.arch }}
    - name: fail on fixable high and critical vulnerabilities
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
      with:
        image-ref: ${{ steps.ref.outputs.ref }}
        exit-code: "1"
        severity: HIGH,CRITICAL
        ignore-unfixed: true
        cache: true
