version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels:
      - dependencies
    cooldown:
      default-days: 3
    groups:
      github-actions:
        update-types:
          - minor
          - patch

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    labels:
      - dependencies
    open-pull-requests-limit: 5
    cooldown:
      default-days: 3
    groups:
      # aide's traits only match the axum, axum-extra and schemars it is built
      # against: bumped one at a time, each PR fails to build.
      aide:
        patterns:
          - aide
          - axum
          - axum-extra
          - schemars
      cargo:
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    labels:
      - dependencies
    open-pull-requests-limit: 5
    cooldown:
      default-days: 3
    groups:
      npm:
        update-types:
          - minor
          - patch

  - package-ecosystem: docker
    directories:
      - /api
      - /web
    schedule:
      interval: weekly
    labels:
      - dependencies
    cooldown:
      default-days: 3

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    labels:
      - dependencies
    cooldown:
      default-days: 3
