name: chart

on:
  push:
    tags:
      - chart-*
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310  # v5.0.1
      - name: derive the version from the tag
        id: version
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          committed="$(sed -n 's/^version: *//p' charts/cinelist/Chart.yaml)"
          if [ "${GITHUB_REF_TYPE}" = tag ]; then
            version="${GITHUB_REF_NAME#chart-}"
            if [ "$committed" != "$version" ]; then
              echo "Chart.yaml says ${committed} but the tag says ${version}." >&2
              echo "Cut chart releases with scripts/release.sh --chart so the two stay in step." >&2
              exit 1
            fi
            documented="$(sed -n 's|.*/charts/cinelist --version \([^ ]*\).*|\1|p' README.md)"
            if [ "${version#*-}" = "$version" ] && [ "$documented" != "$version" ]; then
              echo "README.md installs ${documented} but the tag says ${version}." >&2
              echo "Cut chart releases with scripts/release.sh --chart so the two stay in step." >&2
              exit 1
            fi
          elif [ "${GITHUB_REF_NAME}" = "${DEFAULT_BRANCH}" ]; then
            version="$committed"
          else
            echo "The chart is published from a chart-* tag or from ${DEFAULT_BRANCH}, not from ${GITHUB_REF_NAME}." >&2
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
      - name: package the chart
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: helm package charts/cinelist --version "$VERSION" --destination dist
      - name: push the chart to GHCR
        env:
          VERSION: ${{ steps.version.outputs.version }}
          OWNER: ${{ github.repository_owner }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$TOKEN" | helm registry login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin
          helm push "dist/cinelist-${VERSION}.tgz" "oci://ghcr.io/${OWNER}/charts"
