# Lint gate only: the test suites run in the `quality` workflow, not here.
default_install_hook_types:
  - pre-commit
  - commit-msg

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        # A Helm template is Go templating, not YAML, until it is rendered.
        exclude: ^charts/[^/]+/templates/
      - id: check-added-large-files
        exclude: ^(web/package-lock\.json|logo\.png)$
      - id: check-merge-conflict
      - id: detect-private-key

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint
        # Warning-level rules are printed and then ignored without this.
        args:
          - --strict
        exclude: ^charts/[^/]+/templates/

  - repo: https://github.com/sqlfluff/sqlfluff
    rev: 4.3.0
    hooks:
      - id: sqlfluff-lint

  - repo: https://github.com/biomejs/pre-commit
    rev: v2.5.14
    hooks:
      - id: biome-check
        additional_dependencies:
          - "@biomejs/biome@2.5.14"

  - repo: https://github.com/hadolint/hadolint
    rev: v2.15.1
    hooks:
      - id: hadolint

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint-system

  - repo: local
    hooks:
      - id: no-co-authors
        name: no co-authors in commit message
        entry: '^\s*co-authored-by:|\bgenerated with\b'
        language: pygrep
        args:
          - --ignore-case
        stages:
          - commit-msg
      - id: cargo-fmt
        name: cargo fmt
        entry: cargo fmt --all -- --check
        language: system
        types:
          - rust
        pass_filenames: false
      - id: cargo-clippy
        name: cargo clippy
        entry: cargo clippy --workspace --all-targets --locked -- -D warnings
        language: system
        files: (\.rs|Cargo\.toml|Cargo\.lock|\.sql)$
        pass_filenames: false
      - id: tsc
        name: tsc
        entry: npm --prefix web run typecheck
        language: system
        files: ^web/(src/.*\.tsx?|tsconfig.*\.json|package\.json)$
        pass_filenames: false
      - id: shellcheck
        name: shellcheck
        entry: shellcheck
        language: system
        types:
          - shell
      - id: helm-lint
        name: helm lint
        entry: helm lint charts/cinelist --values charts/cinelist/values-lint.yaml
        language: system
        files: ^charts/
        pass_filenames: false
      - id: helm-docs
        name: helm-docs
        entry: helm-docs --chart-search-root charts
        language: system
        files: ^charts/
        pass_filenames: false
      - id: trivy-chart
        name: trivy config (chart)
        entry: >-
          trivy config --quiet --exit-code 1
          --config-data .trivy/data --ignorefile .trivyignore.yaml
          --helm-values charts/cinelist/values-lint.yaml charts/cinelist
        language: system
        files: ^(charts/|\.trivy/|\.trivyignore\.yaml$)
        pass_filenames: false
      - id: trivy-dockerfile
        name: trivy config (Dockerfile)
        entry: bash -c 'for file in "$@"; do trivy config --quiet --exit-code 1 --ignorefile .trivyignore.yaml "$file" || exit 1; done' --
        language: system
        files: (^|/)Dockerfile$
