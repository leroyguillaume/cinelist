[workspace]
resolver = "3"
members = [
    "api",
]

[workspace.package]
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/leroyguillaume/cinelist"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
