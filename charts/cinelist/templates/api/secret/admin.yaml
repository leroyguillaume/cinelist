{{- if not .Values.api.admin.existingSecret.name }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "cinelist.adminSecretName" . }}
  labels:
    {{- include "cinelist.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ include "cinelist.adminSecretKey" . }}: {{ required "api.admin.password or api.admin.existingSecret.name is required" .Values.api.admin.password | quote }}
{{- end }}
