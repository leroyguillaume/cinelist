{{- if include "cinelist.caCertsGenerateSecret" . }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "cinelist.caCertsName" . }}
  labels:
    {{- include "cinelist.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ include "cinelist.caCertsKey" . }}: {{ .Values.api.caCerts.inline | quote }}
{{- end }}
