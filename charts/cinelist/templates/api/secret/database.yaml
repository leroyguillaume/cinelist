{{- if include "cinelist.generateDatabaseSecret" . }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "cinelist.databaseSecretName" . }}
  labels:
    {{- include "cinelist.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: {{ required "api.database.url is required when postgres.enabled is false" .Values.api.database.url | quote }}
{{- end }}
