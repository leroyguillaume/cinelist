{{- if not .Values.api.jwt.existingSecret.name }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "cinelist.jwtSecretName" . }}
  labels:
    {{- include "cinelist.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ include "cinelist.jwtSecretKey" . }}: {{ required "api.jwt.secret or api.jwt.existingSecret.name is required" .Values.api.jwt.secret | quote }}
{{- end }}
