{{- if .Values.postgres.enabled }}
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: {{ include "cinelist.postgresName" . }}
  labels:
    {{- include "cinelist.labels" . | nindent 4 }}
spec:
  instances: {{ .Values.postgres.instances }}
  {{- with .Values.postgres.imageName }}
  imageName: {{ . }}
  {{- end }}
  bootstrap:
    initdb:
      database: cinelist
      owner: cinelist
  storage:
    size: {{ .Values.postgres.storage.size }}
    {{- with .Values.postgres.storage.storageClass }}
    storageClass: {{ . }}
    {{- end }}
  resources:
    {{- toYaml .Values.postgres.resources | nindent 4 }}
{{- end }}
