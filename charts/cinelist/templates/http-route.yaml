{{- if .Values.httpRoute.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "cinelist.fullname" . }}
  labels:
    {{- include "cinelist.labels" . | nindent 4 }}
  {{- with .Values.httpRoute.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
    - name: {{ required "httpRoute.gateway.name is required when the HTTPRoute is enabled" .Values.httpRoute.gateway.name }}
      namespace: {{ default .Release.Namespace .Values.httpRoute.gateway.namespace }}
      {{- with .Values.httpRoute.gateway.sectionName }}
      sectionName: {{ . }}
      {{- end }}
  hostnames:
    - {{ include "cinelist.host" . }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api
      backendRefs:
        - name: {{ include "cinelist.componentName" (dict "ctx" $ "component" "api") }}
          port: {{ .Values.api.service.port }}
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ include "cinelist.componentName" (dict "ctx" $ "component" "web") }}
          port: {{ .Values.web.service.port }}
{{- end }}
