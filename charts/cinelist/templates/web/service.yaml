apiVersion: v1
kind: Service
metadata:
  name: {{ include "cinelist.componentName" (dict "ctx" $ "component" "web") }}
  labels:
    {{- include "cinelist.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "cinelist.selectorLabels" (dict "ctx" $ "component" "web") | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.web.service.port }}
      targetPort: http
