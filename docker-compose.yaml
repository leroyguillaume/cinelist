# Development stack: the database the API and its tests run against.
services:
  postgres:
    image: postgres:19.0-alpine@sha256:cac45fb483caee3668946088a1c0532db89d5285c28dbfeac889b4068296e06f
    environment:
      POSTGRES_USER: cinelist
      POSTGRES_PASSWORD: cinelist
      POSTGRES_DB: cinelist
    ports:
      - "5442:5432"
    volumes:
      - postgres:/var/lib/postgresql
    healthcheck:
      test:
        - CMD
        - pg_isready
        - --username=cinelist
      interval: 2s
      timeout: 2s
      retries: 15

volumes:
  postgres: {}
