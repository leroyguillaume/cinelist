# Development stack: the database the API and its tests run against.
services:
  postgres:
    image: postgres:18.6-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    environment:
      POSTGRES_USER: cinelist
      POSTGRES_PASSWORD: cinelist
      POSTGRES_DB: cinelist
    ports:
      - "5442:5432"
    volumes:
      - postgres:/var/lib/postgresql
    healthcheck:
      test:
        - CMD
        - pg_isready
        - --username=cinelist
      interval: 2s
      timeout: 2s
      retries: 15

volumes:
  postgres: {}
