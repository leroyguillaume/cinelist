# Development stack: the database the API and its tests run against.
services:
  postgres:
    image: postgres:18.6-alpine@sha256:9ba53c7d41ea093baf5c1ba635ba5434c4f979880527d49bb7d9237d3193085b
    environment:
      POSTGRES_USER: cinelist
      POSTGRES_PASSWORD: cinelist
      POSTGRES_DB: cinelist
    ports:
      - "5442:5432"
    volumes:
      - postgres:/var/lib/postgresql
    healthcheck:
      test:
        - CMD
        - pg_isready
        - --username=cinelist
      interval: 2s
      timeout: 2s
      retries: 15

volumes:
  postgres: {}
