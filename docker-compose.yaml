# Development stack: the database the API and its tests run against.
services:
  postgres:
    image: postgres:18.6-alpine@sha256:10a5c69a83035ab5239f5620d708520e8b28f5aa1f2b20143e6024532edadfb5
    environment:
      POSTGRES_USER: cinelist
      POSTGRES_PASSWORD: cinelist
      POSTGRES_DB: cinelist
    ports:
      - "5442:5432"
    volumes:
      - postgres:/var/lib/postgresql
    healthcheck:
      test:
        - CMD
        - pg_isready
        - --username=cinelist
      interval: 2s
      timeout: 2s
      retries: 15

volumes:
  postgres: {}
